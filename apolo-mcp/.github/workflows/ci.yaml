name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|py3.12|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run linters
        run: make lint
        env:
          CI_LINT_RUN: 1

  unit:
    name: Unit
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu, macos]
        exclude:
          - python-version: "3.10"
            os: macos
          - python-version: "3.11"
            os: macos
      fail-fast: false
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run unit tests
        run: make test PYTEST_ARGS="-vvv"
        env:
          COLOR: yes

  deploy:
    name: Deploy
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      - name: GitHub Release
        uses: aio-libs/create-release@v1.6.6
        with:
          changes_file: CHANGELOG.md
          name: apolo-mcp
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pypi_token: ""
          version_file: src/apolo_mcp/_version.py
          start_line: "[comment]: # (towncrier release notes start)"
          head_line: "# apolo-mcp {version} \\(\\d+-\\d+-\\d+\\)"
          fix_issue_regex:
            "\\(\\[#(\\d+)\\]\\(https://github.com/neuro-inc/apolo-mcp/issues/\\\
            1\\)\\)"
          fix_issue_repl: "(#\\1)"
